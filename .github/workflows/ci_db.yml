name: "CI: DB"

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci_db.yml"

concurrency:
  group: ci-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: DB generate and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Load env
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec dotenv -e .env -- turbo run db:generate --filter=@repo/db

      - name: Typecheck
        run: pnpm exec dotenv -e .env -- turbo run typecheck --filter=@repo/db
