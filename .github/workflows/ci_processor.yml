name: CI: Processor
on:
  pull_request:
    branches:
      - "**"
    paths:
      - "processor/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Load env
        run: cp .env.example .env

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
