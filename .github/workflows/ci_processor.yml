name: "CI: Processor"

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "apps/processor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci_processor.yml"

concurrency:
  group: ci-processor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Processor typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Load env
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=processor

      - name: Lint
        run: pnpm exec turbo run lint --filter=processor

      - name: Build
        run: pnpm exec turbo run build --filter=processor
