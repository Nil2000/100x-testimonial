name: "Deploy: Processor"

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push processor image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/processor/Dockerfile
          push: true
          tags: |
            ghcr.io/nil2000/testiflow-processor:latest
            ghcr.io/nil2000/testiflow-processor:${{ github.sha }}

  deploy:
    name: Pull and restart on VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure install dir
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p /opt/testiflow

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /opt/testiflow
          strip_components: 1
          overwrite: true

      - name: Write env, pull, restart
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_QUEUE: ${{ secrets.REDIS_QUEUE }}
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,REDIS_PASSWORD,REDIS_QUEUE,APP_URL,INTERNAL_API_KEY,OPENROUTER_API_KEY
          script: |
            umask 077
            {
              printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
              printf 'REDIS_QUEUE=%s\n' "$REDIS_QUEUE"
              printf 'APP_URL=%s\n' "$APP_URL"
              printf 'INTERNAL_API_KEY=%s\n' "$INTERNAL_API_KEY"
              printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            } > /opt/testiflow/.env
            cd /opt/testiflow
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
